services:
  hwil-private-server:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080/tcp"
      - "7777:7777/udp"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
